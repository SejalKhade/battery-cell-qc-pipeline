name: Battery QC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data + build pipeline
        run: |
          python scripts/generate_data.py
          python scripts/build_silver_gold.py

      - name: Run tests with coverage gate
        run: pytest tests/test_api.py -v --cov=app --cov-fail-under=90 --cov-report=term-missing
